services:
  nav2-base:
    build:
      context: ./ros-humble-nav2-base
      dockerfile: Dockerfile
    image: ros-humble-nav2-base:latest

  nav2-gazebo:
    build:
      context: ./ros-humble-nav2-gazebo
      dockerfile: Dockerfile
    image: ros-humble-nav2-gazebo:latest
    depends_on:
      - nav2-base

  tb3-pc:
    build:
      context: ./ros-humble-tb3-pc
      dockerfile: Dockerfile
    image: ros-humble-tb3-pc:latest
    depends_on:
      - nav2-base
  
  tb3-sbc:
    build:
      context: ./ros-humble-tb3-sbc
      dockerfile: Dockerfile
    image: ros-humble-tb3-sbc:latest
    depends_on:
      - nav2-base
